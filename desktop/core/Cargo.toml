[package]
name = "mapcro-desktop-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "mapcro desktop: the replays folder, the settle wait and the local parse, without Tauri"

[dependencies]
mapcro-replay = { path = "../../crates/replay" }
serde.workspace = true
# MIT. Only its Steam-root lookup (`locate_all`: the registry key on Windows, fixed candidate
# paths on Linux); the two files are read here, as its `find_app` lists each library (steam.rs).
steamlocate = "=2.1.1"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[lints]
workspace = true

[[bin]]
name = "mapcro-desktop-parse"
path = "src/bin/parse_child.rs"
