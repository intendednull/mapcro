# The desktop app (desktop/README.md, Building and Releasing), on Windows and Linux.
#
# Every push to main and every PR that touches the app, the web client it shows, the parser it
# runs or this file: a debug build of each, installed as a user would (NSIS `/S`; the .deb), then
# a smoke test of the installed app over WebDriver (desktop/smoke/smoke.mjs: the page loads, the
# IPC bridge answers, no plugin is the page's, a fake Steam install's replays are found, and a
# mapcro:// board link reaches the window, from a second launch and at start). The installer's
# and the .deb's mapcro:// registration is checked after each install.
# A tag `desktop-v<version>` also builds the signed release bundles into a draft GitHub
# release with the updater's `latest.json` (Windows NSIS, Linux AppImage and .deb), once both
# smoke tests pass, plus the Windows portable zip and stable-named copies of it and the installer
# (desktop/README.md, Installer or portable). The `publish` job then checks the draft is complete
# and publishes it: a green tag run is a release, and installed apps update from it. A manual run
# does the tests only.
#
# Secrets (repository settings, never in the repo):
#   TAURI_SIGNING_PRIVATE_KEY           the updater's minisign private key (the file's contents)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# The matching public key goes in desktop/app/tauri.conf.json `plugins.updater.pubkey`. The test
# builds need neither (`tauri.nosign.conf.json` turns the updater artifacts off), so PRs from forks
# run them too. No Authenticode signing yet (unsigned beta: Windows SmartScreen warns on first run).
name: desktop
on:
  push:
    branches: [main]
    # Path filters don't apply to tag pushes: every desktop tag builds.
    tags: ["desktop-v*"]
    paths:
      - "desktop/**"
      - "web/**"
      - "crates/replay/**"
      - "crates/stats/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "web/**"
      - "crates/replay/**"
      - "crates/stats/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  TAURI_DRIVER_VERSION: 2.1.0

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: debug
          # Kept when a later step fails: the CLIs and the debug build are most of the job's time.
          cache-on-failure: true
          workspaces: |
            . -> target
            desktop/app -> target
      - name: Native logic on Windows (path discovery, settle, parse child)
        run: cargo test -p mapcro-desktop-core
      - name: Tauri CLI and tauri-driver
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo install tauri-driver --version $env:TAURI_DRIVER_VERSION --locked
      - name: Debug installer (takes MAPCRO_URL; no updater artifacts)
        working-directory: desktop/app
        run: cargo tauri build --debug --bundles nsis --config tauri.nosign.conf.json
      - name: Silent install, then launch the installed app
        id: install
        run: |
          $setup = Get-ChildItem desktop/app/target/debug/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\mapcro\*.exe" | Where-Object { $_.Name -notmatch '^uninstall' } | Select-Object -First 1
          if (-not $exe) { Get-ChildItem -Recurse "$env:LOCALAPPDATA\mapcro" | Out-Host; throw "no installed exe" }
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          # Up for 15 s on the live site (no MAPCRO_URL), then closed.
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "the installed app exited ($($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          # Its WebView2 children can outlive it; none should be left for the smoke test.
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
      - name: The installer registered mapcro:// (per-user)
        run: |
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\mapcro\shell\open\command').'(default)'
          Write-Output "mapcro:// opens: $cmd"
          if ($cmd -notmatch '%1') { throw "mapcro:// isn't registered to the app" }
      - name: A fake Steam install (registry here; the files and synthetic replays in the smoke test)
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Steam'
          New-Item -ItemType Directory -Force $root | Out-Null
          # What the app reads (steamlocate: HKLM InstallPath), and what Steam itself also writes.
          reg add 'HKLM\SOFTWARE\Wow6432Node\Valve\Steam' /v InstallPath /d $root /f
          reg add 'HKCU\Software\Valve\Steam' /v SteamPath /d $root /f
          "MAPCRO_SMOKE_STEAM=$root" >> $env:GITHUB_ENV
      - name: msedgedriver for the installed WebView2
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $v = (Get-ItemProperty $key).pv
          Write-Output "WebView2 $v"
          $zip = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$v/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'edgedriver')
          $drv = Join-Path $env:RUNNER_TEMP 'edgedriver\msedgedriver.exe'
          & $drv --version
          # A wrapper, so msedgedriver logs verbosely (tauri-driver passes it only the port).
          $log = Join-Path $env:RUNNER_TEMP 'diag\msedgedriver.log'
          New-Item -ItemType Directory -Force (Split-Path $log) | Out-Null
          $cmd = Join-Path $env:RUNNER_TEMP 'edgedriver\msedgedriver-verbose.cmd'
          "@`"$drv`" --verbose `"--log-path=$log`" %*" | Set-Content -Encoding ascii $cmd
          Get-Content $cmd
          "NATIVE_DRIVER=$cmd" >> $env:GITHUB_ENV
      - name: Smoke test of the installed app (tauri-driver + msedgedriver)
        run: |
          # For a failure: the app's and WebView2's processes (command lines), every 3 s.
          $out = Join-Path $env:RUNNER_TEMP 'diag\processes.txt'
          $sampler = Start-Job -ArgumentList $out -ScriptBlock {
            param($out)
            while ($true) {
              "=== $(Get-Date -Format o)" | Add-Content $out
              Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'mapcro|msedge|tauri' } |
                ForEach-Object { "$($_.ProcessId) <- $($_.ParentProcessId) $($_.Name): $($_.CommandLine)" } | Add-Content $out
              Start-Sleep -Seconds 3
            }
          }
          try { node desktop/smoke/smoke.mjs "${{ steps.install.outputs.exe }}" --fake-steam }
          finally { Stop-Job $sampler; Remove-Job $sampler -Force }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: On failure, msedgedriver's verbose log and the process samples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-diag
          path: ${{ runner.temp }}/diag
          if-no-files-found: warn
      - name: The portable build registers mapcro:// itself (desktop/README.md, Installer or portable)
        working-directory: desktop/app
        run: |
          cargo build --features portable
          $exe = (Resolve-Path target/debug/mapcro-desktop.exe).Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "the portable build exited ($($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\mapcro\shell\open\command').'(default)'
          Write-Output "mapcro:// opens: $cmd"
          if (-not $cmd.Contains($exe)) { throw "the portable build didn't register mapcro:// to itself" }

  linux:
    # The oldest supported Ubuntu, so the AppImage's glibc floor stays low.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: WebKitGTK and the bundle tools (Tauri's Linux prerequisites), WebKitWebDriver, Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf file webkit2gtk-driver xvfb dbus
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: debug
          workspaces: |
            . -> target
            desktop/app -> target
      - name: Native logic on Linux
        run: cargo test -p mapcro-desktop-core
      - name: Tauri CLI and tauri-driver
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo install tauri-driver --version "$TAURI_DRIVER_VERSION" --locked
      - name: Debug .deb (takes MAPCRO_URL; no updater artifacts)
        working-directory: desktop/app
        run: cargo tauri build --debug --bundles deb --config tauri.nosign.conf.json
      - name: Install the .deb
        id: install
        run: |
          deb=$(ls desktop/app/target/debug/bundle/deb/*.deb | head -1)
          sudo apt-get install -y "./$deb"
          bin=$(dpkg -L "$(dpkg-deb -f "$deb" Package)" | grep '^/usr/bin/' | head -1)
          test -x "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          # The package's desktop file handles mapcro:// links (desktop/README.md, Deep links).
          desktop=$(dpkg -L "$(dpkg-deb -f "$deb" Package)" | grep '/usr/share/applications/.*\.desktop$' | head -1)
          grep -H -E '^(Exec|MimeType)=' "$desktop"
          grep -q '^MimeType=.*x-scheme-handler/mapcro' "$desktop"
          grep -q '^Exec=.*%u' "$desktop"
      - name: Smoke test of the installed app (tauri-driver + WebKitWebDriver, under Xvfb; fake Steam via XDG_DATA_HOME; a D-Bus session for the mapcro:// hand-off)
        run: xvfb-run -a dbus-run-session -- node desktop/smoke/smoke.mjs "${{ steps.install.outputs.bin }}" --fake-steam

  release-windows:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [windows, linux]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          workspaces: |
            . -> target
            desktop/app -> target
      - name: Updater key is configured
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if grep -q REPLACE_WITH desktop/app/tauri.conf.json; then
            echo "::error::Put the updater's public key in desktop/app/tauri.conf.json (desktop/README.md, Releasing)"; exit 1
          fi
          if [ "$HAS_KEY" != true ]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY secret (desktop/README.md, Releasing)"; exit 1
          fi
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Installer, and a draft release with latest.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop/app
          tauriScript: cargo tauri
          args: --bundles nsis
          tagName: desktop-v__VERSION__
          releaseName: mapcro desktop __VERSION__
          releaseBody: "Unsigned beta. Windows may say \"Windows protected your PC\": More info → Run anyway. Linux: the AppImage or the .deb."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      # The portable zip (desktop/README.md, Installer or portable), and stable-named copies of it
      # and of the installer: tauri-action's names carry the version, and the site links to
      # releases/latest/download/<name> (web/src/player/desktop.ts).
      - name: Portable zip, and the stable-named copies, into the same draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content desktop/app/tauri.conf.json -Raw | ConvertFrom-Json).version
          $out = Join-Path $env:RUNNER_TEMP 'assets'
          $dir = Join-Path $env:RUNNER_TEMP 'portable'
          New-Item -ItemType Directory -Force $out, $dir | Out-Null
          $setup = Get-ChildItem desktop/app/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no installer built" }
          Copy-Item $setup.FullName (Join-Path $out 'mapcro_x64-setup.exe')
          Push-Location desktop/app
          cargo tauri build --no-bundle --features portable
          Pop-Location
          Copy-Item desktop/app/target/release/mapcro-desktop.exe (Join-Path $dir 'mapcro.exe')
          Copy-Item desktop/app/portable/README.txt $dir
          $zip = Join-Path $out "mapcro_${v}_x64-portable.zip"
          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $zip
          Copy-Item $zip (Join-Path $out 'mapcro_x64-portable.zip')
          Get-ChildItem $out | Out-Host
          gh release upload "${{ github.ref_name }}" (Get-ChildItem $out).FullName --clobber

  # After Windows, not beside it: tauri-action adds its platform to the draft's latest.json by
  # reading and rewriting it, so two jobs at once could each drop the other's entry.
  release-linux:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [release-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: WebKitGTK and the bundle tools (Tauri's Linux prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          workspaces: |
            . -> target
            desktop/app -> target
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      # The updater replaces an AppImage only, so latest.json's `linux-x86_64` names the AppImage;
      # a .deb is updated by installing the new one.
      - name: AppImage and .deb, into the same draft release and latest.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop/app
          tauriScript: cargo tauri
          args: --bundles appimage,deb
          tagName: desktop-v__VERSION__
          releaseName: mapcro desktop __VERSION__
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  # Publishes the draft once both platforms are in it (operator, 2026-11-11: publish automatically
  # when the checks pass). It checks what the lead checked by hand: every asset the site and the
  # updater link to is there, and latest.json names this version for both platforms.
  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [release-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: The draft is complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="${TAG#desktop-v}"
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for a in latest.json "mapcro_${v}_x64-setup.exe" "mapcro_${v}_x64-setup.exe.sig" \
                   "mapcro_${v}_x64-portable.zip" mapcro_x64-setup.exe mapcro_x64-portable.zip \
                   "mapcro_${v}_amd64.AppImage" "mapcro_${v}_amd64.AppImage.sig" "mapcro_${v}_amd64.deb"; do
            grep -qxF "$a" <<<"$names" || { echo "::error::missing asset $a"; exit 1; }
          done
          dir=$(mktemp -d)
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p latest.json -D "$dir"
          jq -e --arg v "$v" '.version == $v
            and (.platforms["windows-x86_64"].url | endswith("_x64-setup.exe"))
            and (.platforms["linux-x86_64"].url | endswith(".AppImage"))
            and ([.platforms[].signature | length > 0] | all)' "$dir/latest.json"
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
