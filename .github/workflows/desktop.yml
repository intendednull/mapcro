# The Windows app (desktop/README.md, Releasing). Not run on every push: a tag `desktop-v<version>`
# builds the installer and a draft GitHub release with it and the updater's `latest.json`; a
# manual run builds the installer as an artifact only.
#
# Secrets (repository settings, never in the repo):
#   TAURI_SIGNING_PRIVATE_KEY           the updater's minisign private key (the file's contents)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# The matching public key goes in desktop/app/tauri.conf.json `plugins.updater.pubkey`.
# No Authenticode signing yet (unsigned beta: Windows SmartScreen warns on first run).
name: desktop
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/app -> target
      - name: Native logic on Windows (path discovery, settle, parse child)
        run: cargo test -p mapcro-desktop-core
      - name: Updater key is configured
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if grep -q REPLACE_WITH desktop/app/tauri.conf.json; then
            echo "::error::Put the updater's public key in desktop/app/tauri.conf.json (desktop/README.md, Releasing)"; exit 1
          fi
          if [ "$HAS_KEY" != true ]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY secret (desktop/README.md, Releasing)"; exit 1
          fi
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build, and (on a tag) a draft release with latest.json
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop/app
          tauriScript: cargo tauri
          args: --bundles nsis
          tagName: desktop-v__VERSION__
          releaseName: mapcro for Windows __VERSION__
          releaseBody: "Unsigned beta: Windows may say \"Windows protected your PC\"; More info → Run anyway."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Build only (manual run)
        if: "!startsWith(github.ref, 'refs/tags/desktop-v')"
        working-directory: desktop/app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles nsis
      - name: Installer artifact (manual run)
        if: "!startsWith(github.ref, 'refs/tags/desktop-v')"
        uses: actions/upload-artifact@v4
        with:
          name: mapcro-windows
          path: desktop/app/target/release/bundle/nsis/*
