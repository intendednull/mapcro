name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Clippy, warnings as errors
        run: nix develop -c just clippy
      - name: Rust tests and 1,000 simulation seeds
        run: nix develop -c just test
      - name: Web client against the real server
        run: nix develop -c bash -c 'cd web && npm ci && cd .. && just web-test'
      - name: Protocol model (random simulation)
        run: nix develop -c bash -c 'cd model && npm ci && cd .. && just model-sim 5000'
      - name: NixOS service VM test
        run: nix build .#checks.x86_64-linux.service -L
      - name: Generated TypeScript types are current
        run: nix develop -c just ts && git diff --exit-code web/src/gen
