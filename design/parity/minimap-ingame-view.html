<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Minimap, in-game view</title>
<link rel="stylesheet" href="../shared/minimap.css">
<link rel="stylesheet" href="stage.css">
<!-- Local game art, git-ignored. Missing on a fresh clone: the minimap falls back to CSS shapes. -->
<link rel="stylesheet" href="../_art/parity/parity.css">
<link rel="stylesheet" href="tweaks.css">
</head>
<body>
<div class="stage" data-dc-id="stage">
  <div class="caption" data-dc-id="caption">In-game minimap, reconstructed from the HUD sources · scale 2× · friendly Hidden King (Amber) at the bottom</div>
  <div class="mm-container" data-dc-id="minimap-container">
    <div class="mm-host" data-viewpoint="amber" data-player data-ids data-dc-id="minimap"></div>
  </div>
  <div class="mm-location" data-dc-id="minimap-location"><span class="district">Hidden King :</span>&nbsp;<span class="building">Base</span></div>
  
</div>
<script src="../shared/minimap-data.js"></script>
<script src="../shared/minimap.js"></script>
</body>
</html>
