[workspace]
resolver = "3"
members = ["crates/schema", "crates/engine", "crates/sim", "crates/server", "crates/wasm", "crates/extract", "crates/replay", "crates/stats", "desktop/core"]
# The Tauri shell is its own workspace: it needs WebKitGTK to build on Linux (desktop/README.md).
exclude = ["desktop/app", "crates/vendor"]

# boon and pbdems2, vendored (MIT) with a streamed-reader patch: crates/vendor/VENDORED.md.
[patch.crates-io]
boon-deadlock = { path = "crates/vendor/boon-deadlock" }
pbdems2 = { path = "crates/vendor/pbdems2" }

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
mapcro-schema = { path = "crates/schema" }
mapcro-engine = { path = "crates/engine" }
mapcro-stats = { path = "crates/stats" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rand = "0.9"
rand_chacha = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
