[package]
name = "mapcro-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "mapcro server: rooms, link capabilities, durable storage, static web client"

[[bin]]
name = "mapcro-server"
path = "src/main.rs"

[dependencies]
mapcro-schema.workspace = true
mapcro-engine.workspace = true
serde.workspace = true
serde_json = "1"
zstd = { version = "=0.13.3", default-features = false }
thiserror.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header", "limit"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
# Match import's upstream calls (deadlock-api.com), run on the blocking pool.
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
sha2 = "0.10"
tokio-tungstenite = "0.27"
ureq = { version = "3", features = ["json"] }
tempfile = "3"

[features]
# Test-only crash points (room.rs `failpoint`); never enabled in a release build.
failpoints = []

[lints]
workspace = true
