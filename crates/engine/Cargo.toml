[package]
name = "mapcro-engine"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "mapcro sync engine: the authority and the client replica. Pure and deterministic; no I/O"

[dependencies]
mapcro-schema.workspace = true
serde.workspace = true
thiserror.workspace = true
sha2 = "0.10"
serde_json = "1"
ts-rs = { version = "12", optional = true }

[features]
# Generate TypeScript bindings for the web client (`just ts`).
ts = ["dep:ts-rs", "mapcro-schema/ts"]

[lints]
workspace = true
