[package]
name = "mapcro-extract"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "mapcro game-asset extractor: VPK, binary KV3, Source 2 textures and map entities"

[[bin]]
name = "mapcro-extract"
path = "src/main.rs"

[dependencies]
mapcro-stats.workspace = true
crc32fast = "1"
lz4_flex = "0.14"
png = "0.18"
ruzstd = "0.9"
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
texture2ddecoder = "0.1"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
