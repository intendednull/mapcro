[package]
name = "mapcro-replay"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "mapcro replay worker: parses a Deadlock .dem in a sandbox into a compact match timeline"

# The timeline format and its checks build without the parser (the server uses only those).
# `parse` is the parser alone, for any target (a wasm build: no C, no processes); the worker
# binary and its queue need `worker` (TD-25).
[features]
default = ["worker"]
parse = ["dep:boon-deadlock", "dep:boon-proto", "dep:prost", "dep:snap"]
# boon's memory-mapped `Parser::from_file`: the preview's fallback, `parse::header`, the probes.
mmap = ["parse", "boon-deadlock/mmap"]
worker = ["parse", "mmap", "dep:bzip2", "dep:zstd", "dep:libc"]

[[bin]]
name = "mapcro-replay"
path = "src/main.rs"
required-features = ["worker"]

[dependencies]
serde.workspace = true
serde_json = "1"
base64 = "0.22"
# MIT; pinned: field paths and the coordinate decoding are checked against this version
# (docs/research/replay-parsing-exploration.md).
# Vendored with a streamed reader (crates/vendor/VENDORED.md); boon-data downloads (reqwest)
# and the memory map are features, off unless asked for.
boon-deadlock = { version = "=0.19.0", default-features = false, optional = true }
# boon's own protobuf types, to decode the ult-cast user message.
boon-proto = { version = "0.4", optional = true }
prost = { version = "0.14", optional = true }
bzip2 = { version = "0.6", optional = true }
zstd = { version = "=0.13.3", default-features = false, optional = true }
# The preview reads demo commands itself (preview.rs); boon uses the same.
snap = { version = "1", optional = true }
# O_NOFOLLOW for the server's order file.
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
